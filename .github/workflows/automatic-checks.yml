name: Cinema automatic checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'bot.py'
      - 'test_*.py'
      - 'requirements.txt'
      - '.github/workflows/automatic-checks.yml'
permissions:
  contents: write
concurrency:
  group: cinema-bot
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Verify VOX access before setup
        if: env.TELEGRAM_BOT_TOKEN == ''
        run: python bot.py --check
      - name: Run monitor
        run: python bot.py
      - name: Save encrypted state
        run: |
          if [ -f state.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.enc
            if ! git diff --cached --quiet; then
              git commit -m "Save encrypted cinema bot state"
              for attempt in 1 2 3 4 5; do
                if timeout 45s git push origin HEAD:main; then
                  echo "Encrypted state saved successfully."
                  exit 0
                fi
                if [ "$attempt" -eq 5 ]; then
                  echo "::error::Could not save encrypted state after 5 attempts."
                  exit 1
                fi
                if timeout 20s git fetch --depth=1 origin main; then
                  remote=$(git rev-parse FETCH_HEAD)
                  base=$(git rev-parse HEAD^)
                  if git diff --quiet HEAD "$remote" -- state.enc; then
                    echo "Encrypted state already saved."
                    exit 0
                  fi
                  if ! git diff --quiet "$base" "$remote" -- state.enc; then
                    echo "::error::Remote encrypted state changed; refusing to overwrite it."
                    exit 1
                  fi
                  if [ "$remote" != "$base" ]; then
                    git rebase --onto "$remote" "$base"
                  fi
                fi
                echo "::warning::State upload failed; retrying without running the monitor again."
                sleep $((attempt * 3))
              done
            fi
          fi
